workflows:
  android-workflow:
    name: MC World Hub APK
    max_build_duration: 30
    environment:
      flutter: "3.35.4"
      java: "21"
    scripts:
      - name: Get dependencies
        script: |
          flutter packages pub get
      - name: Build APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/apk/release/app-release.apk
    publishing:
      email:
        recipients:
          - salmanzahi@gmail.com
        notify:
          success: true
          failure: true
